# Netlify — publica a landing estática de marketing (landing/index.html).
# O host/client (Go) NÃO é deployado aqui; só o site institucional.
[build]
  base    = "landing"
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
